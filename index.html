<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="رُشد — الحكمة المالية | Rushd — Financial Wisdom Tracker">
    <title>رُشد | Rushd</title>

    <link rel="stylesheet" href="/fonts/google-fonts.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/rushd-192.png">

    <script>
        (() => {
            const bootTheme = localStorage.getItem('rushd_theme') === 'light' ? 'light' : 'dark';
            const bootThemeColor = bootTheme === 'light' ? '#f4f7fb' : '#09090b';
            const motionPreference = ['auto', 'full', 'balanced', 'lite'].includes(localStorage.getItem('rushd_motion')) ? localStorage.getItem('rushd_motion') : 'auto';
            const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection || null;
            const deviceMemory = Number(navigator.deviceMemory || 0);
            const hardwareConcurrency = Number(navigator.hardwareConcurrency || 0);
            const saveData = !!connection?.saveData;
            const smallTouchViewport = window.matchMedia && window.matchMedia('(max-width: 820px)').matches && ('ontouchstart' in window || navigator.maxTouchPoints > 0);
            const autoMotion = saveData || (deviceMemory && deviceMemory <= 3) || (hardwareConcurrency && hardwareConcurrency <= 4)
                ? 'lite'
                : (smallTouchViewport || (deviceMemory && deviceMemory <= 6) || (hardwareConcurrency && hardwareConcurrency <= 6))
                    ? 'balanced'
                    : 'full';
            const bootMotion = prefersReducedMotion ? 'reduce' : motionPreference === 'auto' ? autoMotion : motionPreference;
            document.documentElement.dataset.theme = bootTheme;
            document.documentElement.dataset.motion = bootMotion;
            document.documentElement.dataset.motionSetting = motionPreference;
            document.documentElement.style.colorScheme = bootTheme;
            document.querySelector('meta[name="theme-color"]')?.setAttribute('content', bootThemeColor);
        })();
    </script>

    <style>
        html:not([data-boot-visual-ready='true']) #app {
            visibility: hidden !important;
        }

        html:not([data-icons-ready='true']) .material-symbols-rounded {
            visibility: hidden !important;
        }

        #rushd-boot-screen {
            position: fixed;
            inset: 0;
            z-index: 2147483647;
            display: grid;
            place-items: center;
            background: #09090b;
            color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        html[data-theme='light'] #rushd-boot-screen {
            background: #f4f7fb;
            color: #18181b;
        }

        html[data-boot-visual-ready='true'] #rushd-boot-screen {
            display: none;
        }

        .rushd-boot-content {
            display: grid;
            justify-items: center;
            gap: 24px;
        }

        .rushd-boot-brand {
            font-size: 32px;
            font-weight: 700;
        }

        .rushd-boot-indicator {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(129, 140, 248, 0.22);
            border-top-color: #818cf8;
            border-radius: 50%;
            animation: rushd-boot-spin 1s linear infinite;
        }

        @keyframes rushd-boot-spin {
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .rushd-boot-indicator { animation: none; }
        }
    </style>

    <link rel="stylesheet" href="/fonts/material-symbols-rounded.css">
    <script>
        (() => {
            const root = document.documentElement;
            let appMounted = false;
            let fontSettled = false;
            const reveal = () => {
                if (appMounted && fontSettled) root.dataset.bootVisualReady = 'true';
            };
            window.addEventListener('rushd:app-mounted', () => {
                appMounted = true;
                reveal();
            }, { once: true });
            const deadline = setTimeout(() => {
                fontSettled = true;
                reveal();
            }, 9000);
            if (!document.fonts?.load) {
                clearTimeout(deadline);
                fontSettled = true;
                reveal();
                return;
            }
            document.fonts.load('24px "Material Symbols Rounded"', 'home')
                .then((faces) => {
                    if (faces.some((face) => face.status === 'loaded')) root.dataset.iconsReady = 'true';
                })
                .catch(() => undefined)
                .finally(() => {
                    clearTimeout(deadline);
                    fontSettled = true;
                    reveal();
                });
        })();
    </script>
    <script src="/retire-rejected-shell.js"></script>
</head>

<body>
    <div id="rushd-boot-screen" role="status" aria-label="جارٍ تحميل رُشد — Loading Rushd">
        <div class="rushd-boot-content">
            <span class="rushd-boot-brand">رُشد</span>
            <span class="rushd-boot-indicator" aria-hidden="true"></span>
        </div>
    </div>
    <div class="cinema-wrapper">
        <div class="cinema-backdrop"></div>
        <div id="app" v-cloak></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
